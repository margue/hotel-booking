contexts:
  - name: Hotel
    domainVisionStatement: To manage the booking and check-in/check-out of hotel rooms
    terms:
      - name: BookingInterval
        definition: The time period of a booking.
        examples:
          - A guest specifies the booking interval when placing a reservation.
          - For a given room, the booking intervals of its bookings may not overlap.
        aliases:
          - none
      - name: Invoice
        definition: The legal entity that represents a guest's payment.
      - name: Payment
        definition: The transfer of money from a guest to the hotel.
      - name: Room
        definition: The smallest unit that can be booked by a guest.
      - name: RoomNumber
        definition: The number that serves to identify each guest room.
      - name: Repository
        definition: Provides functionality for accessing and publishing the associated object.


