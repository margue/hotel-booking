contexts:
  - name: Hotel
    domainVisionStatement: To manage the booking and check-in/check-out of hotel rooms
    terms:
      - name: Booking
        definition: The description of a booking, i.e. time period and name of the guest.
        examples:
          - A booking is the promise of a guest to occupy a room for the given time period.
          - For a given room, the time periods of its bookings may not overlap.
          - The booking starts with the check-in date. This is the date the guest wishes to arrive.
          - The booking ends with the check-out date. This is the date the guest wishes to depart.
        aliases:
          - none
      - name: Invoice
        definition: The legal entity that represents a guest's payment.
        examples:
          - The invoice displays the guest's date of arrival and departure, thus specifying the time the guest actually used the room.
      - name: ArrivalDate
        definition: The day on which the guest actually starts to use the booked room.
        examples:
          - The guest checks in on their day of arrival.
          - The arrival date cannot be earlier than the check-in date of the corresponding booking.
          - If the guest wants to check in before the check-in date of the corresponding booking, the booking needs to be modified before the end of the desired check-in day.
      - name: BookingsForRoom
        definition: Contains all existing bookings for a given room. This is an Entity with the room number as its identifier.
      - name: DepartureDate
        definition: The day on which the guest actually leaves the room / the hotel.
        examples:
          - The guest checks out on their day of departure.
          - The departure date cannot be later than the check-out date of the corresponding booking.
          - If the guest wants to depart after the check-out date of the corresponding booking, the booking needs to be modified before the end of the day of the check-out.
      - name: Payment
        definition: The transfer of money from a guest to the hotel.
      - name: Room
        definition: The smallest unit that can be booked by a guest.
        examples:
          - Each room has its unique Room Number.
          - When booking a room, the guest specifies the check-in date and the check-out date.
          - A guest checks into a room on their arrival date.
          - A guest checks out of a room on their departure date.
      - name: RoomNumber
        definition: The number that serves to identify each guest room.
      - name: Repository
        definition: Provides functionality for accessing and publishing the associated object.


